<div class="container" style="padding:20px;">
   <div class="right-space-margin pt-4">
      <h3 class="text-primary text-left fw-bold fs-3">Punto de Venta</h3>
      <hr />
      <p>Aquí puedes gestionar las ventas y el inventario de productos.</p>
      <div class="shop-grid">
        <div *ngFor="let p of products" class="card m-2 align-items-center shop-card">
          <img [src]="getImageSrc(p.imagen)" class="m-2" alt="{{p.name}}" width="100" height="100"/>
          <div class="card-body">
            <h5 class="card-title">{{p.name}}</h5>
            <p class="card-text text-center">{{p.category_name}}</p>
            <button class="btn btn-primary" (click)="addToCart(p)">Agregar al carrito</button>
          </div>
        </div>
      </div>
   </div>
   <div class="position-fixed top-0 end-0 h-100 border border-left-primary p-3 right-space-menu">
      <h4 class="text-primary fs-5">Resumen de compra</h4>
      <div class="position-absolute bottom-30 start-0">
         <h4 class="text-primary">Total: {{ getTotal() | currency }}</h4>
      </div>
   </div>
</div>
