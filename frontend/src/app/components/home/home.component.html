<ng-container>
    <div class="position-fixed top-0 start-0 h-100 color-menu p-3 left-space-menu">
      <div class="border border-primary rounded-4 pointer mb-3 p-3 position-relative svg-cube-hover text-menu" 
      (click)="navigateTo('products')" [ngClass]="{'svg-cube-hover-active': isActive('/products')}">
        <div class="w-100 text-center mb-2">

            <svg class="cube-svg cube-svg-default" width="100" height="100" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <polygon points="100,100 180,60 180,140 100,180" 
                    stroke="#dddd" stroke-width="10" fill="transparent" stroke-linejoin="round"/>
                <polygon points="100,100 20,60 20,140 100,180" 
                    stroke="#dddd" stroke-width="10" fill="transparent" stroke-linejoin="round"/>
                <polygon points="100,20 180,60 100,100 20,60" 
                    fill="transparent" stroke="#dddd" stroke-width="10" stroke-linejoin="round"/>
            </svg>

            <svg class="cube-svg cube-svg-hover" width="100" height="100" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <polygon points="100,100 180,60 180,140 100,180" 
                        stroke="white" stroke-width="10" fill="transparent" stroke-linejoin="round"/>
                    <polygon points="100,100 20,60 20,140 100,180" 
                        stroke="white" stroke-width="10" fill="transparent" stroke-linejoin="round"/>
                    <polygon points="100,20 180,60 100,100 20,60" 
                        fill="transparent" stroke="white" stroke-width="10" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="text-center fs-4 fw-bold">Inventario</div>
      </div>
      <div class="border border-primary rounded-4 pointer mb-3 p-3 position-relative svg-cube-hover text-menu" 
      (click)="navigateTo('shop')" [ngClass]="{'svg-cube-hover-active': isActive('/shop')}">
        <div class="w-100 text-center mb-2">
            <svg class="cube-svg cube-svg-default" width="100" height="100" viewBox="0 0 50 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="#dddd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="17" cy="39" r="2"/>
                    <circle cx="35" cy="39" r="2"/>
                    <path d="M3 7h5l6 24h22l6-16H12"/>
                </g>
            </svg>
            <svg class="cube-svg cube-svg-hover" width="100" height="100" viewBox="0 0 50 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="17" cy="39" r="2"/>
                    <circle cx="35" cy="39" r="2"/>
                    <path d="M3 7h5l6 24h22l6-16H12"/>
                </g>
            </svg>
        </div>
        <div class="text-center fs-4 fw-bold">Ventas</div>
      </div>
            <div class="border border-primary rounded-4 pointer mb-3 p-3 position-relative svg-cube-hover text-menu" 
            (click)="navigateTo('reports')" [ngClass]="{'svg-cube-hover-active': isActive('/reports')}">
                <div class="w-100 text-center mb-2">
                        <svg class="cube-svg cube-svg-default" width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3h18v4H3z" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M3 10h18v11H3z" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M7 14v4" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 14v4" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17 14v4" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <svg class="cube-svg cube-svg-hover" width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 3h18v4H3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M3 10h18v11H3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M7 14v4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 14v4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17 14v4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                </div>
                <div class="text-center fs-4 fw-bold">Reportes</div>
            </div>
      
      <div class="border border-primary rounded-4 pointer mb-3 p-3 position-relative svg-cube-hover text-menu" 
      (click)="navigateTo('settings')" [ngClass]="{'svg-cube-hover-active': isActive('/settings')}">
        <div class="w-100 text-center mb-2">
            <svg class="cube-svg cube-svg-default" width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="#dddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="cube-svg cube-svg-hover" width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="text-center fs-4 fw-bold">Configuración</div>
      </div>
      <!-- Puedes agregar más tarjetas aquí -->
    </div>
    <div class="left-space-margin pt-4">
        <div class="text-primary text-center fw-bold fs-2">Bienvenido a {{ shopName }} POS</div>
        <router-outlet></router-outlet>
    </div>

</ng-container>
