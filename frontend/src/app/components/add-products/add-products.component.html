<div class="modal fade show d-block" tabindex="-1" style="background:rgba(0,0,0,0.5);" *ngIf="visible">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>
      <div class="modal-body">
        <form class="mb-3" (ngSubmit)="saveProduct()">

          <label class="form-label">Imagen de referencia:</label>
          <div class="mb-2">
            <button class="btn btn-secondary me-2" type="button" (click)="openFilePicker()">Seleccionar Imagen</button>
            <span *ngIf="product.image && !isUrl(product.image)">{{ getFileName(product.image) }} seleccionado</span>
          </div>
          <div class="mb-2">
            <input class="form-control" type="text" placeholder="O pega una URL de imagen (http...)"
              [(ngModel)]="product.image"
              (ngModelChange)="onImageInputChange($event)"
              name="imageUrl" />
            <span *ngIf="product.image && isUrl(product.image)">URL seleccionada</span>
          </div>

          <div *ngIf="getImagePreview()" class="mb-2">
            <img [src]="getImagePreview()" alt="Vista previa" style="max-width:100px;max-height:100px; border:1px solid #ccc; border-radius:4px;" />
          </div>

          <!-- Campo de Código de Barras -->
          <div class="mb-3">
            <label class="form-label">
              <i class="fas fa-barcode me-2"></i>
              Código de Barras / QR (Opcional)
            </label>
            
            <div class="input-group" [class.capturing-mode]="isCapturingBarcode">
              <input 
                class="form-control" 
                type="text" 
                [(ngModel)]="product.code" 
                name="code" 
                placeholder="Ingrese código manualmente o use la pistola lectora"
                (blur)="validateBarcodeCode()"
                (keydown)="onBarcodeKeyDown($event)"
                id="barcode-instruction"
                [class.capturing-mode]="isCapturingBarcode"
              />
              <button 
                class="btn btn-outline-secondary" 
                type="button" 
                (click)="startBarcodeCapture()"
                [class.btn-warning]="isCapturingBarcode"
                title="Capturar con pistola lectora"
              >
                <i class="fas fa-scan" *ngIf="!isCapturingBarcode"></i>
                <i class="fas fa-spinner fa-spin" *ngIf="isCapturingBarcode"></i>
                {{ isCapturingBarcode ? 'Escaneando...' : 'Escanear' }}
              </button>
            </div>
            
            <small class="form-text text-muted mt-1">
              <i class="fas fa-info-circle me-1"></i>
              <span *ngIf="!isCapturingBarcode">
                Puede ingresar el código manualmente o hacer clic en "Escanear" y usar la pistola lectora.
              </span>
              <span *ngIf="isCapturingBarcode" class="text-warning">
                <strong>Modo captura activado:</strong> Use la pistola lectora ahora. Presione Enter para confirmar o Escape para cancelar.
              </span>
            </small>
          </div>

          <label class="form-label">Nombre:</label>
          <input class="form-control" [(ngModel)]="product.name" name="name" required />

          <label class="form-label">Precio:</label>
          <input class="form-control" type="number" [(ngModel)]="product.price" name="price" required />

          <label class="form-label">Cantidad:</label>
          <input class="form-control" type="number" [(ngModel)]="product.stock" name="stock" min="1" required />

          <label class="form-label">Color:</label>
          <input class="form-control" type="text" [(ngModel)]="product.color" name="color" required placeholder="Ejemplo: verde, rojo, azul" />

          <label class="form-label">Categoría:</label>
          <select class="form-select" [(ngModel)]="product.category_id" name="category_id" required>
              <option [ngValue]="null" disabled selected>Selecciona una categoría</option>
              <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
          </select>
          <div class="text-end">
              <button class="btn btn-primary mt-3" type="submit">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
